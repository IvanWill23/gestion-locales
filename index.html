<!DOCTYPE html>
<html lang="es">

<title>Gestión Locales Limpieza</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e5e3dc;--border2:#d0cec4;
  --text:#1a1916;--text2:#6b6960;--text3:#9d9b94;
  --accent:#1d9e75;--accent-light:#e1f5ee;--accent-dark:#0f6e56;
  --warn:#ba7517;--warn-light:#faeeda;
  --danger:#a32d2d;--danger-light:#fcebeb;
  --info:#185fa5;--info-light:#e6f1fb;
  --liniers:#7c3aed;--liniers-light:#ede9fe;
  --flores:#db2777;--flores-light:#fce7f3;
  --radius:10px;--radius-sm:6px;
  --sidebar:220px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* ── Sidebar ── */
.sidebar-logo{padding:16px;border-bottom:0.5px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:700}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{font-weight:600}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.local-liniers .nav-item.active{background:var(--liniers-light);color:var(--liniers)}
.local-flores .nav-item.active{background:var(--flores-light);color:var(--flores)}

/* ── Local selector ── */
.local-selector{padding:10px;border-bottom:0.5px solid var(--border)}
.local-btn{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s}
.local-btn:hover{border-color:var(--border2)}
.local-btn.liniers{border-color:var(--liniers);background:var(--liniers-light);color:var(--liniers)}
.local-btn.flores{border-color:var(--flores);background:var(--flores-light);color:var(--flores)}
.local-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-liniers{background:var(--liniers)}
.dot-flores{background:var(--flores)}

/* ── Topbar ── */
.topbar{background:var(--surface);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.topbar h2{font-size:15px;font-weight:600;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.local-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-liniers{background:var(--liniers-light);color:var(--liniers)}
.badge-flores{background:var(--flores-light);color:var(--flores)}

/* ── Loading ── */
.loading-overlay{position:fixed;inset:0;background:rgba(247,246,243,.85);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}

/* ── Login ── */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:32px;width:100%;max-width:400px;text-align:center}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:24px}
.login-locals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.login-local-btn{padding:20px 12px;border-radius:var(--radius);border:1.5px solid var(--border2);background:var(--bg);cursor:pointer;transition:all .15s;font-size:14px;font-weight:600}
.login-local-btn:hover{transform:translateY(-1px)}
.login-local-btn.lin{border-color:var(--liniers);background:var(--liniers-light);color:var(--liniers)}
.login-local-btn.flo{border-color:var(--flores);background:var(--flores-light);color:var(--flores)}
.login-local-btn div{font-size:24px;margin-bottom:6px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent-dark)}
.btn-primary:hover{background:var(--accent-dark)}
.btn-liniers{background:var(--liniers);color:#fff;border-color:#5b21b6}
.btn-liniers:hover{background:#5b21b6}
.btn-flores{background:var(--flores);color:#fff;border-color:#9d174d}
.btn-flores:hover{background:#9d174d}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-light)}

/* ── Inputs ── */
input,select,textarea{width:100%;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,158,117,.15)}
.form-group{margin-bottom:0}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}

/* ── Cards / Stats ── */
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:13px;font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.bg-green{background:#eaf3de;color:#3b6d11}
.bg-warn{background:var(--warn-light);color:#633806}
.bg-danger{background:var(--danger-light);color:var(--danger)}
.bg-info{background:var(--info-light);color:#0c447c}
.bg-gray{background:#f1efe8;color:#5f5e5a}

/* ── Table ── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:0.5px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.tbl-wrap{overflow-x:auto}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border:0.5px solid var(--border)}
.modal-head{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:0.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── Misc ── */
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:var(--warn-light);color:#633806;border:0.5px solid #fac775}
.alert-info{background:var(--info-light);color:#0c447c;border:0.5px solid #b5d4f4}
.alert-ok{background:#eaf3de;color:#3b6d11;border:0.5px solid #c0dd97}
.alert-err{background:var(--danger-light);color:var(--danger);border:0.5px solid #f7c1c1}
.rank-bar{height:5px;border-radius:3px;background:var(--accent-light);margin-top:4px}
.rank-fill{height:100%;border-radius:3px;background:var(--accent)}
.progress{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1916;color:#fff;padding:11px 16px;border-radius:var(--radius);font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all .25s;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.search-wrap{position:relative}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}
.search-wrap input{padding-left:32px}
.instruc{background:var(--info-light);border:0.5px solid #b5d4f4;border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.instruc-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:none;border:none;cursor:pointer;text-align:left}
.instruc-title{font-size:13px;font-weight:600;color:#0c447c;flex:1}
.instruc-sub{font-size:11px;color:#185fa5;margin-top:1px}
.instruc-body{padding:4px 16px 14px;border-top:0.5px solid #b5d4f4}
.instruc-step{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.step-num{width:20px;height:20px;border-radius:50%;background:#185fa5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step-text{font-size:13px;color:#0c447c;line-height:1.5}
.todo-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;cursor:pointer}
.todo-check.done{background:var(--accent);border-color:var(--accent)}

/* ── Responsive ── */
@media(max-width:768px){
  :root{--sidebar:0px}
  .sidebar{position:fixed;left:-240px;width:240px;height:100%;z-index:50;transition:left .25s;box-shadow:none}
  .sidebar.open{left:0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .content{padding:14px 16px}
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .cols-2,.cols-3{grid-template-columns:1fr}
  .topbar{padding:12px 16px}
}
.menu-btn{display:none}
@media(max-width:768px){.menu-btn{display:flex}}
.overlay-sidebar{display:none;position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.3)}
</style>
</head>

function showLoading(txt='Cargando...'){S.loading=true;$('loading').style.display='flex';$('loading-text').textContent=txt;}
function hideLoading(){S.loading=false;$('loading').style.display='none';}

async function apiGet(action,extra=''){
  const url=`${API}?action=${action}&local=${S.local}${extra}`;
  const r=await fetch(url);
  return r.json();
}

async function apiPost(body){
  const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});
  return r.json();
}

async function cargarDatos(){
  showLoading('Sincronizando datos...');
  try{
    const [v,st,m]=await Promise.all([
      apiGet('getVentas'),
      apiGet('getStock'),
      apiGet('getMovimientos'),
    ]);
    S.ventas=Array.isArray(v)?v:[];
    S.stock=Array.isArray(st)?st:[];
    S.movimientos=Array.isArray(m)?m:[];
    render();
  }catch(e){
    toast('Error al conectar con Google Sheets. Verificá tu conexión.','err');
  }finally{hideLoading();}
}

// ── STOCK ─────────────────────────────────────────────────
function vStock(){
  const q=S.searchStock.toLowerCase();
  const cats=[...new Set(S.stock.map(p=>p.Categoria))].sort();
  let prods=S.stock.filter(p=>{
    if(q&&!p.Producto.toLowerCase().includes(q)&&!p.Categoria.toLowerCase().includes(q))return false;
    if(S.stockCat!=='todas'&&p.Categoria!==S.stockCat)return false;
    if(S.stockEstado==='sin'&&Number(p.Stock)>0)return false;
    if(S.stockEstado==='bajo'&&!(Number(p.Stock)>0&&Number(p.Stock)<=Number(p.StockMin)))return false;
    if(S.stockEstado==='ok'&&Number(p.Stock)<=Number(p.StockMin))return false;
    return true;
  });
  if(S.stockOrden==='alerta')prods.sort((a,b)=>(Number(a.Stock)-Number(a.StockMin))-(Number(b.Stock)-Number(b.StockMin)));
  else if(S.stockOrden==='nombre')prods.sort((a,b)=>a.Producto.localeCompare(b.Producto));
  else if(S.stockOrden==='precio_desc')prods.sort((a,b)=>Number(b.Precio)-Number(a.Precio));
  else if(S.stockOrden==='precio_asc')prods.sort((a,b)=>Number(a.Precio)-Number(b.Precio));
  else if(S.stockOrden==='stock_asc')prods.sort((a,b)=>Number(a.Stock)-Number(b.Stock));
  else if(S.stockOrden==='stock_desc')prods.sort((a,b)=>Number(b.Stock)-Number(a.Stock));
  const sin=S.stock.filter(p=>Number(p.Stock)<=0).length;
  const bajo=S.stock.filter(p=>Number(p.Stock)>0&&Number(p.Stock)<=Number(p.StockMin)).length;
  return `
  ${instruc('stock')}
  <div class="grid g3" style="margin-bottom:14px">
    <div class="stat"><div class="stat-label">Sin stock</div><div class="stat-value" style="color:var(--danger)">${sin}</div></div>
    <div class="stat"><div class="stat-label">Stock bajo</div><div class="stat-value" style="color:var(--warn)">${bajo}</div></div>
    <div class="stat"><div class="stat-label">Productos</div><div class="stat-value">${S.stock.length}</div></div>
  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Inventario — ${S.local}</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="search-wrap" style="width:180px"><span class="search-icon">${ico('search',13)}</span><input type="text" placeholder="Buscar..." value="${S.searchStock}" oninput="S.searchStock=this.value;render()"></div>
        <select style="width:auto" onchange="S.stockCat=this.value;render()">
          <option value="todas" ${S.stockCat==='todas'?'selected':''}>Todas las cats.</option>
          ${cats.map(c=>`<option value="${c}" ${S.stockCat===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <select style="width:auto" onchange="S.stockEstado=this.value;render()">
          <option value="todos" ${S.stockEstado==='todos'?'selected':''}>Todos</option>
          <option value="sin" ${S.stockEstado==='sin'?'selected':''}>Sin stock</option>
          <option value="bajo" ${S.stockEstado==='bajo'?'selected':''}>Bajo</option>
          <option value="ok" ${S.stockEstado==='ok'?'selected':''}>OK</option>
        </select>
        <select style="width:auto" onchange="S.stockOrden=this.value;render()">
          <option value="alerta">Por alerta</option>
          <option value="nombre">Nombre A-Z</option>
          <option value="precio_desc">Mayor precio</option>
          <option value="precio_asc">Menor precio</option>
          <option value="stock_desc">Más stock</option>
          <option value="stock_asc">Menos stock</option>
        </select>
      </div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px">${prods.length} producto${prods.length!==1?'s':''}</div>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Mín.</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        ${prods.map(p=>{
          const stk=Number(p.Stock),mn=Number(p.StockMin);
          const pct=mn>0?Math.min(100,Math.round(stk/mn*100)):100;
          const clr=stk<=0?'var(--danger)':stk<=mn?'var(--warn)':'var(--accent)';
          const est=stk<=0?'<span class="badge bg-danger">Sin stock</span>':stk<=mn?'<span class="badge bg-warn">Bajo</span>':'<span class="badge bg-green">OK</span>';
          return `<tr>
            <td style="font-weight:500;min-width:160px">${p.Producto}</td>
            <td><span class="badge bg-gray" style="font-size:10px">${p.Categoria}</span></td>
            <td>${money(p.Precio)}</td>
            <td style="color:var(--text2)">${money(p.Costo)}</td>
            <td><span style="font-weight:600;color:${clr}">${stk}</span><div class="progress"><div class="progress-fill" style="width:${pct}%;background:${clr}"></div></div></td>
            <td style="color:var(--text3)">${mn}</td>
            <td>${est}</td>
            <td style="white-space:nowrap">
              <button class="btn btn-sm" style="margin-right:4px" onclick='editStock(${JSON.stringify(p)})'>${ico('edit',13)}</button>
              <button class="btn btn-sm btn-danger" onclick="delProd('${p.ID}')">${ico('trash',13)}</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  </div>`;
}

// ── RANKING ───────────────────────────────────────────────
function topProds(n,mes,cat){
  let fil=S.ventas;
  if(mes!=='todos'){const[y,m]=mes.split('-').map(Number);fil=fil.filter(v=>{const d=parseDate(v.Fecha);return d.getFullYear()===y&&d.getMonth()+1===m;});}
  if(cat!=='todas')fil=fil.filter(v=>v.Categoria===cat);
  const map={};
  fil.forEach(v=>{
    if(!map[v.Producto])map[v.Producto]={nombre:v.Producto,qty:0,total:0};
    map[v.Producto].qty+=Number(v.Cantidad||0);
    map[v.Producto].total+=Number(v.Total||0);
  });
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,n);
}

function getMeses(){
  const set=new Set();
  S.ventas.forEach(v=>{const d=parseDate(v.Fecha);set.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);});
  return[...set].sort().reverse().map(val=>{
    const[y,m]=val.split('-').map(Number);
    return{val,label:new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})};
  });
}

function vRanking(){
  const meses=getMeses();
  const cats=[...new Set(S.ventas.map(v=>v.Categoria).filter(Boolean))].sort();
  const top=topProds(25,S.filtroRankMes,S.filtroRankCat);

    <select style="width:auto" onchange="S.filtroRankMes=this.value;render()">

    <select style="width:auto" onchange="S.filtroRankCat=this.value;render()">
      <option value="todas">Todas las categorías</option>
      ${cats.map(c=>`<option value="${c}" ${S.filtroRankCat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <span style="font-size:13px;color:var(--text2)">${top.length} productos · ${top.reduce((a,t)=>a+t.qty,0)} u. vendidas</span>
  </div>
  <div class="card">
    <div class="card-header"><span class="card-title">Ranking por cantidad vendida — ${S.local}</span></div>
    ${top.length===0?`<div class="empty">${ico('chart',32)}<p style="margin-top:10px">Sin ventas para este filtro</p></div>`:
    top.map((p,i)=>`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="width:26px;height:26px;border-radius:50%;background:${i<3?'var(--accent)':'var(--bg)'};color:${i<3?'#fff':'var(--text2)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0">${i+1}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:3px">
            <span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.nombre}</span>
            <span style="font-size:13px;font-weight:600;color:var(--accent-dark);flex-shrink:0">${p.qty} u. · ${money(p.total)}</span>
          </div>
          <div class="rank-bar"><div class="rank-fill" style="width:${Math.round(p.qty/maxQ*100)}%"></div></div>
        </div>

  </div>`;

function showModal(html){
  let bk=$('modal-bg');
  if(!bk){bk=document.createElement('div');bk.className='modal-bg';bk.id='modal-bg';document.body.appendChild(bk);}
  bk.innerHTML=`<div class="modal">${html}</div>`;
  bk.onclick=e=>{if(e.target===bk)closeModal();};
}
function closeModal(){const bk=$('modal-bg');if(bk)bk.remove();}

function modalHead(title){return `<div class="modal-head"><span class="modal-title">${title}</span><button class="btn btn-sm" onclick="closeModal()">${ico('x',14)}</button></div>`;}
function modalFoot(saveFn,delFn=''){return `<div class="modal-foot">${delFn?`<button class="btn btn-sm btn-danger" style="margin-right:auto" onclick="${delFn}">${ico('trash',13)} Eliminar</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="${saveFn}">${ico('ok',14)} Guardar</button></div>`;}

function prodOptions(sel=''){
  return CATALOGO.map(p=>`<option value="${p.nombre}" ${sel===p.nombre?'selected':''}>${p.nombre}</option>`).join('');
}

let ventaItems=[{prod:'',qty:1,precio:0,medio:'Efectivo'}];

function openModalVenta(){

function ventaItemHTML(it,i){
  const total=it.qty&&it.precio?money(it.qty*it.precio):'-';

    </div>

      <div class="form-group"><label>Cantidad</label><input type="number" id="vi-q-${i}" min="1" value="${it.qty}" onchange="viChange(${i},'qty',+this.value)"></div>

function viChange(i,f,v){

}
function addVentaItem(){ventaItems.push({prod:'',qty:1,precio:0,medio:'Efectivo'});renderModalVenta();}
function removeVentaItem(i){ventaItems.splice(i,1);renderModalVenta();}

async function guardarVenta(){
  const fechaRaw=$('v-fecha').value;
  if(!fechaRaw)return toast('Ingresá una fecha','err');
  const fecha=new Date(fechaRaw);
  const fechaFmt=`${String(fecha.getDate()).padStart(2,'0')}/${String(fecha.getMonth()+1).padStart(2,'0')}/${fecha.getFullYear()}`;
  const items=[];
  for(let i=0;i<ventaItems.length;i++){
    const prod=$(`vi-p-${i}`)?.value;
    if(!prod)return toast('Seleccioná todos los productos','err');
    const qty=+($(`vi-q-${i}`)?.value||1);
    const precio=+($(`vi-pr-${i}`)?.value||0)||CATALOGO.find(x=>x.nombre===prod)?.precio||0;
    const medio=$(`vi-m-${i}`)?.value||'Efectivo';
    const cat=CATALOGO.find(x=>x.nombre===prod)?.cat||'';
    items.push({local:S.local,fecha:fechaFmt,producto:prod,categoria:cat,cantidad:qty,precioUnit:precio,medioPago:medio,total:qty*precio,usuario:S.usuario});
  }
  closeModal();showLoading('Guardando venta...');
  try{
    for(const it of items) await apiPost({action:'addVenta',data:it});
    await cargarDatos();
    toast(`${items.length} venta${items.length!==1?'s':''} guardada${items.length!==1?'s':''}!`,'ok');
  }catch(e){hideLoading();toast('Error al guardar','err');}
}

  <div class="modal-body">

    </div>

async function guardarEditVenta(id){
  const prod=$('ev-prod').value;
  const qty=+$('ev-qty').value;
  const precio=+$('ev-precio').value;
  const fecha=$('ev-fecha').value;
  const medio=$('ev-medio').value;
  const cat=CATALOGO.find(x=>x.nombre===prod)?.cat||'';
  closeModal();showLoading('Actualizando venta...');
  try{
    await apiPost({action:'editVenta',data:{id,local:S.local,fecha,producto:prod,categoria:cat,cantidad:qty,precioUnit:precio,medioPago:medio,total:qty*precio,usuario:S.usuario}});
    await cargarDatos();toast('Venta actualizada','ok');
  }catch(e){hideLoading();toast('Error al actualizar','err');}
}

async function delVenta(id){
  if(!confirm('¿Eliminar esta venta? El stock se restaurará.'))return;
  closeModal();showLoading('Eliminando...');
  try{await apiPost({action:'deleteVenta',id});await cargarDatos();toast('Venta eliminada','ok');}
  catch(e){hideLoading();toast('Error al eliminar','err');}
}
