<html lang="es">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--border:#e5e3dc;--border2:#d0cec4;
  --text:#1a1916;--text2:#6b6960;--text3:#9d9b94;
  --accent:#1d9e75;--accent-light:#e1f5ee;--accent-dark:#0f6e56;
  --warn:#ba7517;--warn-light:#faeeda;
  --danger:#a32d2d;--danger-light:#fcebeb;
  --info:#185fa5;--info-light:#e6f1fb;
  --liniers:#7c3aed;--liniers-light:#ede9fe;
  --flores:#db2777;--flores-light:#fce7f3;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:20px 24px}
.sidebar-logo{padding:16px;border-bottom:0.5px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:700}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.nav{padding:10px 8px;flex:1;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:10px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13px;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{font-weight:600}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.local-liniers .nav-item.active{background:var(--liniers-light);color:var(--liniers)}
.local-flores .nav-item.active{background:var(--flores-light);color:var(--flores)}
.local-selector{padding:10px;border-bottom:0.5px solid var(--border)}
.local-btn{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--border2);background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s}
.local-btn.liniers{border-color:var(--liniers);background:var(--liniers-light);color:var(--liniers)}
.local-btn.flores{border-color:var(--flores);background:var(--flores-light);color:var(--flores)}
.local-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-liniers{background:var(--liniers)}.dot-flores{background:var(--flores)}
.topbar{background:var(--surface);border-bottom:0.5px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.topbar h2{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.local-badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-liniers{background:var(--liniers-light);color:var(--liniers)}
.badge-flores{background:var(--flores-light);color:var(--flores)}
.loading-overlay{position:fixed;inset:0;background:rgba(247,246,243,.92);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--text2);font-weight:500}
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:32px;width:100%;max-width:420px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--text2);margin-bottom:24px}
.login-locals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.login-local-btn{padding:24px 12px;border-radius:var(--radius);border:2px solid var(--border2);background:var(--bg);cursor:pointer;transition:all .2s;font-size:15px;font-weight:700}
.login-local-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.login-local-btn.lin{border-color:var(--liniers);background:var(--liniers-light);color:var(--liniers)}
.login-local-btn.flo{border-color:var(--flores);background:var(--flores-light);color:var(--flores)}
.login-local-btn div{font-size:28px;margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent-dark)}
.btn-primary:hover{background:var(--accent-dark)}
.btn-liniers{background:var(--liniers);color:#fff;border-color:#5b21b6}.btn-liniers:hover{background:#5b21b6}
.btn-flores{background:var(--flores);color:#fff;border-color:#9d174d}.btn-flores:hover{background:#9d174d}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{color:var(--danger)}.btn-danger:hover{background:var(--danger-light)}
input,select,textarea{width:100%;padding:8px 12px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;background:var(--surface);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(29,158,117,.15)}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px}
.form-row{display:grid;gap:12px;margin-bottom:12px}
.cols-2{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:13px;font-weight:600}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.bg-green{background:#eaf3de;color:#3b6d11}.bg-warn{background:var(--warn-light);color:#633806}
.bg-danger{background:var(--danger-light);color:var(--danger)}.bg-info{background:var(--info-light);color:#0c447c}.bg-gray{background:#f1efe8;color:#5f5e5a}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:0.5px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg)}
.tbl-wrap{overflow-x:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border:0.5px solid var(--border)}
.modal-head{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:0.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.alert{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px}
.alert-warn{background:var(--warn-light);color:#633806;border:0.5px solid #fac775}
.alert-info{background:var(--info-light);color:#0c447c;border:0.5px solid #b5d4f4}
.alert-ok{background:#eaf3de;color:#3b6d11;border:0.5px solid #c0dd97}
.alert-err{background:var(--danger-light);color:var(--danger);border:0.5px solid #f7c1c1}
.rank-bar{height:5px;border-radius:3px;background:var(--accent-light);margin-top:4px}
.rank-fill{height:100%;border-radius:3px;background:var(--accent)}
.progress{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1916;color:#fff;padding:11px 16px;border-radius:var(--radius);font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:all .25s;pointer-events:none;max-width:320px}
.toast.show{transform:translateY(0);opacity:1}
.search-wrap{position:relative}.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.5}
.search-wrap input{padding-left:32px}
.instruc{background:var(--info-light);border:0.5px solid #b5d4f4;border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.instruc-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;background:none;border:none;cursor:pointer;text-align:left}
.instruc-title{font-size:13px;font-weight:600;color:#0c447c;flex:1}
.instruc-sub{font-size:11px;color:#185fa5;margin-top:1px}
.instruc-body{padding:4px 16px 14px;border-top:0.5px solid #b5d4f4}
.instruc-step{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.step-num{width:20px;height:20px;border-radius:50%;background:#185fa5;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.step-text{font-size:13px;color:#0c447c;line-height:1.5}
.todo-check{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;cursor:pointer}
.todo-check.done{background:var(--accent);border-color:var(--accent)}
.menu-btn{display:none}
@media(max-width:768px){
  .sidebar{position:fixed;left:-240px;width:240px;height:100%;z-index:50;transition:left .25s}
  .sidebar.open{left:0;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .content{padding:14px 16px}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}
  .cols-2,.cols-3{grid-template-columns:1fr}
  .topbar{padding:12px 16px}
  .menu-btn{display:flex}
}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.3)}
/* Pantalla de error de conexión */
.conn-error{background:var(--danger-light);border:1px solid #f7c1c1;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.conn-error h3{color:var(--danger);font-size:15px;margin-bottom:8px}
.conn-error p{font-size:13px;color:var(--text2);margin-bottom:12px}
</style>
</head>

// ── API — usa fetch con modo no-cors para POST, JSONP para GET ─
function apiGet(action){
  return new Promise((resolve,reject)=>{
    const cbName='_cb_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const url=`${API}?action=${action}&local=${encodeURIComponent(S.local)}&callback=${cbName}`;
    let settled=false;
    window[cbName]=function(data){
      settled=true;
      document.head.removeChild(script);
      delete window[cbName];
      resolve(Array.isArray(data)?data:(data&&data.error?[]:data||[]));
    };
    script.onerror=()=>{
      if(!settled){settled=true;reject(new Error('Error de red al conectar con Google Sheets'));}
    };
    setTimeout(()=>{
      if(!settled){settled=true;try{document.head.removeChild(script);}catch(e){}delete window[cbName];reject(new Error('Tiempo de espera agotado'));}
    },20000);
    script.src=url;
    document.head.appendChild(script);
  });
}

function apiPost(body){
  return fetch(API,{method:'POST',body:JSON.stringify(body)})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}

function $(id){return document.getElementById(id);}
function fmt(d){return d instanceof Date?d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}):String(d||'');}
function fmtMes(d){return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'});}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-AR');}
function parseDate(s){if(!s)return new Date();const p=String(s).split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(s);}
function showLoad(t){$('loading').style.display='flex';$('loading-text').textContent=t||'Cargando...';}
function hideLoad(){$('loading').style.display='none';}
function cl(){return S.local==='Liniers'?'liniers':'flores';}

async function cargarDatos(){
  showLoad('Sincronizando con Google Sheets...');
  S.connError=false;
  try{
    const[v,st,m]=await Promise.all([
      apiGet('getVentas'),
      apiGet('getStock'),
      apiGet('getMovimientos'),
    ]);
    S.ventas=v||[];
    S.stock=st||[];
    S.movimientos=m||[];
  }catch(e){
    S.connError=true;
    console.error('Error API:',e);
  }finally{
    hideLoad();
    render();
  }
}

function vStock(){
  const q=S.searchStock.toLowerCase();
  const cats=[...new Set(S.stock.map(p=>p.Categoria))].filter(Boolean).sort();
  let prods=S.stock.filter(p=>{
    if(q&&!String(p.Producto).toLowerCase().includes(q)&&!String(p.Categoria).toLowerCase().includes(q))return false;
    if(S.stockCat!=='todas'&&p.Categoria!==S.stockCat)return false;
    const stk=Number(p.Stock),mn=Number(p.StockMin);
    if(S.stockEstado==='sin'&&stk>0)return false;
    if(S.stockEstado==='bajo'&&!(stk>0&&stk<=mn))return false;
    if(S.stockEstado==='ok'&&stk<=mn)return false;
    return true;
  });
  if(S.stockOrden==='alerta')prods.sort((a,b)=>(Number(a.Stock)-Number(a.StockMin))-(Number(b.Stock)-Number(b.StockMin)));
  else if(S.stockOrden==='nombre')prods.sort((a,b)=>String(a.Producto).localeCompare(String(b.Producto)));
  else if(S.stockOrden==='precio_desc')prods.sort((a,b)=>Number(b.Precio)-Number(a.Precio));
  else if(S.stockOrden==='precio_asc')prods.sort((a,b)=>Number(a.Precio)-Number(b.Precio));
  else if(S.stockOrden==='stock_asc')prods.sort((a,b)=>Number(a.Stock)-Number(b.Stock));
  else if(S.stockOrden==='stock_desc')prods.sort((a,b)=>Number(b.Stock)-Number(a.Stock));
  const sin=S.stock.filter(p=>Number(p.Stock)<=0).length;
  const bajo=S.stock.filter(p=>Number(p.Stock)>0&&Number(p.Stock)<=Number(p.StockMin)).length;
  return `${instruc('stock')}

  </div>
  <div class="card">
    <div class="card-header">
      <span class="card-title">Inventario — ${S.local}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div class="search-wrap" style="width:150px"><span class="search-icon">${ic('search',13)}</span><input type="text" placeholder="Buscar..." value="${S.searchStock}" oninput="S.searchStock=this.value;render()"></div>
        <select style="width:auto" onchange="S.stockCat=this.value;render()"><option value="todas">Todas las cats.</option>${cats.map(c=>`<option value="${c}" ${S.stockCat===c?'selected':''}>${c}</option>`).join('')}</select>
        <select style="width:auto" onchange="S.stockEstado=this.value;render()"><option value="todos">Todos</option><option value="sin">Sin stock</option><option value="bajo">Bajo</option><option value="ok">OK</option></select>
        <select style="width:auto" onchange="S.stockOrden=this.value;render()"><option value="alerta">Por alerta</option><option value="nombre">Nombre A-Z</option><option value="precio_desc">Mayor precio</option><option value="precio_asc">Menor precio</option><option value="stock_desc">Más stock</option><option value="stock_asc">Menos stock</option></select>
      </div>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:10px">${prods.length} producto${prods.length!==1?'s':''}</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Costo</th><th>Stock</th><th>Mín.</th><th>Estado</th><th></th></tr></thead>
      <tbody>${prods.map(p=>{
        const stk=Number(p.Stock),mn=Number(p.StockMin);

        const clr=stk<=0?'var(--danger)':stk<=mn?'var(--warn)':'var(--accent)';
        const est=stk<=0?'<span class="badge bg-danger">Sin stock</span>':stk<=mn?'<span class="badge bg-warn">Bajo</span>':'<span class="badge bg-green">OK</span>';
        return `<tr>

          <td style="color:var(--text3)">${mn}</td><td>${est}</td>

            <button class="btn btn-sm" style="margin-right:4px" onclick='editStock(${JSON.stringify(p)})'>${ic('edit',13)}</button>

function getTop(n,mes,cat){
  let fil=S.ventas;
  if(mes!=='todos'){const[y,m]=mes.split('-').map(Number);fil=fil.filter(v=>{const d=parseDate(v.Fecha);return d.getFullYear()===y&&d.getMonth()+1===m;});}
  if(cat!=='todas')fil=fil.filter(v=>v.Categoria===cat);
  const map={};
  fil.forEach(v=>{if(!map[v.Producto])map[v.Producto]={nombre:v.Producto,qty:0,total:0};map[v.Producto].qty+=Number(v.Cantidad||0);map[v.Producto].total+=Number(v.Total||0);});
  return Object.values(map).sort((a,b)=>b.qty-a.qty).slice(0,n);
}
function getMeses(){
  const set=new Set();
  S.ventas.forEach(v=>{const d=parseDate(v.Fecha);if(!isNaN(d))set.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);});
  return[...set].sort().reverse().map(val=>{const[y,m]=val.split('-').map(Number);return{val,label:new Date(y,m-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})};});
}

function showModal(html){

}
function closeModal(){const bk=$('mbg');if(bk)bk.remove();}
function mH(t){return `<div class="modal-head"><span class="modal-title">${t}</span><button class="btn btn-sm" onclick="closeModal()">${ic('x',14)}</button></div>`;}
function mF(sf,df=''){return `<div class="modal-foot">${df?`<button class="btn btn-sm btn-danger" style="margin-right:auto" onclick="${df}">${ic('trash',13)} Eliminar</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="${sf}">${ic('ok',14)} Guardar</button></div>`;}

let _vi=[{prod:'',qty:1,precio:0,medio:'Efectivo'}];
function openModalVenta(){_vi=[{prod:'',qty:1,precio:0,medio:'Efectivo'}];_rmv();}
function _rmv(){
  showModal(`${mH('Nueva venta')}
  <div class="modal-body">
    <div class="form-row"><div class="form-group"><label>Fecha</label><input type="date" id="vf" value="${today.toISOString().split('T')[0]}"></div></div>

  </div>${mF('gV()')}`);
}
function _viH(it,i){
  const tot=it.qty&&it.precio?money(it.qty*it.precio):'-';
  return `<div style="background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;border:0.5px solid var(--border)">
    <div class="form-row cols-2" style="margin-bottom:10px">

      <div class="form-group"><label>Medio de pago</label><select id="vim-${i}" onchange="_vc(${i},'medio',this.value)">${MEDIOS.map(m=>`<option value="${m}" ${it.medio===m?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="form-row cols-3">
      <div class="form-group"><label>Cantidad</label><input type="number" id="viq-${i}" min="1" value="${it.qty}" onchange="_vc(${i},'qty',+this.value)"></div>
      <div class="form-group"><label>Precio unit.</label><input type="number" id="vipr-${i}" value="${it.precio||''}" placeholder="Auto" onchange="_vc(${i},'precio',+this.value)"></div>
      <div class="form-group"><label>Total</label><div style="padding:8px 12px;background:var(--accent-light);border-radius:var(--radius-sm);font-weight:600;color:var(--accent-dark);font-size:13px">${tot}</div></div>
    </div>
    ${i>0?`<button class="btn btn-sm btn-danger" onclick="_vi.splice(${i},1);_rmv()">${ic('trash',13)} Quitar</button>`:''}
  </div>`;
}
function _vc(i,f,v){_vi[i][f]=v;if(f==='prod'){const c=CATALOGO.find(x=>x.nombre===v);if(c){_vi[i].precio=c.precio;const el=$(`vipr-${i}`);if(el)el.value=c.precio;}}}

async function gV(){
  const fd=$('vf')?.value;if(!fd)return toast('Ingresá una fecha','err');
  const fd2=new Date(fd);
  const ff=`${String(fd2.getDate()).padStart(2,'0')}/${String(fd2.getMonth()+1).padStart(2,'0')}/${fd2.getFullYear()}`;
  const items=[];
  for(let i=0;i<_vi.length;i++){
    const prod=$(`vip-${i}`)?.value;if(!prod)return toast('Seleccioná todos los productos','err');
    const qty=+($(`viq-${i}`)?.value||1);
    const precio=+($(`vipr-${i}`)?.value||0)||CATALOGO.find(x=>x.nombre===prod)?.precio||0;
    const medio=$(`vim-${i}`)?.value||'Efectivo';
    const cat=CATALOGO.find(x=>x.nombre===prod)?.cat||'';
    items.push({local:S.local,fecha:ff,producto:prod,categoria:cat,cantidad:qty,precioUnit:precio,medioPago:medio,total:qty*precio,usuario:S.usuario});
  }
  closeModal();showLoad('Guardando venta...');
  try{for(const it of items)await apiPost({action:'addVenta',data:it});await cargarDatos();toast(`${items.length} venta${items.length!==1?'s':''} guardada${items.length!==1?'s':''}!`,'ok');}
  catch(e){hideLoad();toast('Error al guardar: '+e.message,'err');}
}

    <div class="form-row cols-2">

      <div class="form-group"><label>Medio</label><select id="evm">${MEDIOS.map(m=>`<option value="${m}" ${v.MedioPago===m?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>
    <div class="form-row cols-2">
      <div class="form-group"><label>Cantidad</label><input type="number" id="evq" value="${v.Cantidad}" min="1"></div>
      <div class="form-group"><label>Precio unit.</label><input type="number" id="evpr" value="${v.PrecioUnit}"></div>
    </div>
  </div>${mF(`gEV('${v.ID}')`,`delVenta('${v.ID}')`)}`)
}
async function gEV(id){
  const prod=$('evp').value,qty=+$('evq').value,precio=+$('evpr').value,fecha=$('evf').value,medio=$('evm').value;
  const cat=CATALOGO.find(x=>x.nombre===prod)?.cat||'';
  closeModal();showLoad('Actualizando...');
  try{await apiPost({action:'editVenta',data:{id,local:S.local,fecha,producto:prod,categoria:cat,cantidad:qty,precioUnit:precio,medioPago:medio,total:qty*precio,usuario:S.usuario}});await cargarDatos();toast('Venta actualizada','ok');}
  catch(e){hideLoad();toast('Error','err');}
}
async function delVenta(id){

}

  closeModal();showLoad('Registrando...');
  try{await apiPost({action:'addMovimiento',data:{local:S.local,fecha:ff,tipo,producto:prod,cantidad:qty,notas,usuario:S.usuario}});await cargarDatos();toast('Movimiento registrado','ok');}

}

// ── EXPORT ────────────────────────────────────────────────
function toCSV(rows,hdrs){return[hdrs.join(','),...rows.map(r=>hdrs.map(h=>`"${String(r[h]||'').replace(/"/g,'""')}"`).join(','))].join('\n');}
function dlF(c,f){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(c);a.download=f;a.click();}
function exportCSV(tipo){
  if(tipo==='ventas')dlF(toCSV(S.ventas,['Fecha','Producto','Categoria','Cantidad','PrecioUnit','MedioPago','Total','Usuario']),`ventas_${S.local.toLowerCase()}.csv`);
  else if(tipo==='movimientos')dlF(toCSV(S.movimientos,['Fecha','Tipo','Producto','Cantidad','Notas','Usuario']),`movimientos_${S.local.toLowerCase()}.csv`);
  else dlF(toCSV(S.stock,['Producto','Categoria','Stock','StockMin','Precio','Costo']),`inventario_${S.local.toLowerCase()}.csv`);
  toast('CSV descargado','ok');
}
function exportXLSX(){
  const doIt=()=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.ventas),'Ventas');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.movimientos),'Movimientos');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.stock),'Stock');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const blob=new Blob([out],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`${S.local.toLowerCase()}_completo.xlsx`;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('Excel descargado','ok');
  };
  if(window.XLSX)doIt();
  else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=doIt;s.onerror=()=>toast('Necesitás conexión para Excel','err');document.head.appendChild(s);}
}

function nav(id){S.view=id;S.sidebarOpen=false;render();}

function cambiarLocal(){if(confirm('¿Cambiar de local?')){S.local=null;S.ventas=[];S.stock=[];S.movimientos=[];document.body.className='';render();}}
function toast(msg,type){const t=$('toast');t.textContent=msg;t.style.background=type==='err'?'var(--danger)':type==='ok'?'var(--accent)':'#1a1916';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

render();
